url: https://lacdr.github.io/rspacer/
template:
  bootstrap: 5
  light-switch: true

reference:
- title: API
- contents:
  - contains("api_")
  - contains("_api")
  - contains("_instance")
- title: Documents
- contents:
  - starts_with("document_")
- title: Files
- contents:
  - starts_with("file_")
- title: Folders
- contents:
  - starts_with("folder")
- title: Utils
- contents:
  - doc_to_form_id
  - fields_to_data_frame
